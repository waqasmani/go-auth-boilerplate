# EXAMPLE ONLY — do not commit real secrets. In production, source this Secret
# from a secrets manager (External Secrets Operator, Vault Agent, SealedSecrets).
# Every workload (api, migrate, outbox-worker, cleanup) mounts the SAME Secret so
# the crypto key sets are byte-for-byte identical across the fleet.
apiVersion: v1
kind: Secret
metadata:
  name: go-auth-secrets
type: Opaque
stringData:
  APP_ENV: "production"
  DB_DSN: "app_user:CHANGE_ME@tcp(mysql:3306)/go_auth?parseTime=true&loc=UTC&tls=true"
  REDIS_DSN: "redis://:CHANGE_ME@redis:6379/0"
  # Identical across ALL replicas — see docs/DEPLOYMENT.md §2.
  JWT_KEYS: '[{"kid":"k1","secret":"CHANGE_ME_64_BYTES","active":true}]'
  JWT_ISSUER: "go-auth-boilerplate"
  JWT_AUDIENCE: "go-auth-clients"
  TOTP_KEYS: '[{"kid":"t1","key":"CHANGE_ME_BASE64_32B","active":true}]'
  OAUTH_TOKEN_KEYS: '[{"kid":"o1","key":"CHANGE_ME_BASE64_32B","active":true}]'
  OTP_HMAC_SECRET: "CHANGE_ME_32_BYTES_MIN"
  OAUTH_STATE_SECRET: "CHANGE_ME_32_BYTES_MIN"
  EMAIL_SMTP_HOST: "smtp.example.com"
  EMAIL_SMTP_PORT: "587"
  EMAIL_SMTP_USER: "CHANGE_ME"
  EMAIL_SMTP_PASS: "CHANGE_ME"
  EMAIL_FROM: "no-reply@example.com"
